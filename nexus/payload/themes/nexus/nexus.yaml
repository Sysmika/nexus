# Tema "Nexus" — azul marino de la marca para Configuración y el resto de las pantallas internas.
# La marca de agua (logo) la dibuja /local/nexus/nexus-branding.js cuando este tema está activo
# (lo avisa la variable nexus-marca-agua). El dashboard Nexus sigue usando su propio tema.
Nexus:
  nexus-marca-agua: "1"

  # Fondos
  primary-background-color: "#0b1d33"
  secondary-background-color: "#0f2744"
  card-background-color: "#12294a"
  ha-card-background: "#12294a"
  ha-card-border-radius: 14px
  ha-card-border-width: 1px
  ha-card-border-color: "rgba(120,170,230,0.14)"
  ha-card-box-shadow: none

  # Marca
  primary-color: "#4f9be0"
  light-primary-color: "#7db6ee"
  dark-primary-color: "#1f4b7d"
  accent-color: "#6cc6ff"

  # Texto
  primary-text-color: "rgba(255,255,255,0.92)"
  secondary-text-color: "rgba(200,220,245,0.68)"
  text-primary-color: "#ffffff"
  disabled-text-color: "rgba(200,220,245,0.35)"
  divider-color: "rgba(120,170,230,0.16)"

  # Íconos y estados
  state-icon-color: "#8fc2f5"
  state-active-color: "#6cc6ff"
  paper-item-icon-color: "#8fc2f5"
  paper-item-icon-active-color: "#6cc6ff"

  # Encabezado de cada pantalla
  app-header-background-color: "#0f2744"
  app-header-text-color: "#ffffff"
  app-header-border-bottom: "1px solid rgba(120,170,230,0.16)"

  # Barra lateral
  sidebar-background-color: "#081628"
  sidebar-menu-button-background-color: "#081628"
  sidebar-text-color: "rgba(255,255,255,0.86)"
  sidebar-icon-color: "rgba(160,200,245,0.9)"
  sidebar-selected-text-color: "#ffffff"
  sidebar-selected-icon-color: "#ffffff"
  sidebar-selected-background-color: "rgba(31,75,125,0.75)"

  # Controles
  switch-checked-color: "#4f9be0"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "#1f4b7d"
  slider-color: "#4f9be0"
  slider-bar-color: "rgba(120,170,230,0.28)"
  mdc-theme-primary: "#4f9be0"
  table-row-background-color: "rgba(255,255,255,0.00)"
  table-row-alternative-background-color: "rgba(255,255,255,0.03)"
  code-editor-background-color: "#0a1a2e"

  # --- Colores de los componentes nuevos de HA (--ha-color-*): sin esto quedan en su versión clara ---
  # Superficies
  ha-color-surface-default: "#12294a"
  ha-color-surface-low: "#0f2744"
  ha-color-surface-lower: "#0b1d33"
  ha-color-surface-default-inverted: "#e6eef8"
  ha-color-surface-low-inverted: "#f3f7fc"
  ha-color-surface-lower-inverted: "#ffffff"
  ha-color-on-surface-default: "rgba(255,255,255,0.92)"
  ha-color-form-background-disabled: "rgba(255,255,255,0.06)"

  # Texto
  ha-color-text-primary: "rgba(255,255,255,0.92)"
  ha-color-text-secondary: "rgba(200,220,245,0.70)"
  ha-color-text-disabled: "rgba(200,220,245,0.38)"
  ha-color-text-link: "#6cc6ff"
  ha-color-text-primary-inverted: "#0b1d33"
  ha-color-text-secondary-inverted: "#1f3b5c"

  # Rellenos neutros
  ha-color-fill-neutral-quiet-resting: "rgba(255,255,255,0.06)"
  ha-color-fill-neutral-quiet-hover: "rgba(255,255,255,0.11)"
  ha-color-fill-neutral-quiet-active: "rgba(255,255,255,0.08)"
  ha-color-fill-neutral-normal-resting: "rgba(255,255,255,0.10)"
  ha-color-fill-neutral-normal-hover: "rgba(255,255,255,0.17)"
  ha-color-fill-neutral-normal-active: "rgba(255,255,255,0.13)"
  ha-color-fill-neutral-loud-resting: "#3b5f8a"
  ha-color-fill-neutral-loud-hover: "#4a73a3"
  ha-color-fill-neutral-loud-active: "#2f4f75"
  ha-color-fill-disabled-quiet-resting: "rgba(255,255,255,0.04)"
  ha-color-fill-disabled-quiet-hover: "rgba(255,255,255,0.06)"
  ha-color-fill-disabled-normal-resting: "rgba(255,255,255,0.05)"
  ha-color-fill-disabled-normal-hover: "rgba(255,255,255,0.07)"
  ha-color-fill-disabled-loud-resting: "#2a3f5a"
  ha-color-fill-disabled-loud-hover: "#34506f"

  # Rellenos de color (primario, peligro, éxito, aviso)
  ha-color-fill-primary-quiet-resting: "rgba(79,155,224,0.16)"
  ha-color-fill-primary-quiet-hover: "rgba(79,155,224,0.26)"
  ha-color-fill-primary-quiet-active: "rgba(79,155,224,0.21)"
  ha-color-fill-danger-quiet-resting: "rgba(220,49,70,0.20)"
  ha-color-fill-danger-quiet-hover: "rgba(220,49,70,0.30)"
  ha-color-fill-danger-quiet-active: "rgba(220,49,70,0.25)"
  ha-color-fill-success-quiet-resting: "rgba(0,160,70,0.20)"
  ha-color-fill-success-quiet-hover: "rgba(0,160,70,0.30)"
  ha-color-fill-success-quiet-active: "rgba(0,160,70,0.25)"
  ha-color-fill-warning-quiet-resting: "rgba(230,110,0,0.20)"
  ha-color-fill-warning-quiet-hover: "rgba(230,110,0,0.30)"
  ha-color-fill-warning-quiet-active: "rgba(230,110,0,0.25)"

  # Texto sobre rellenos
  ha-color-on-neutral-loud: "#ffffff"
  ha-color-on-neutral-normal: "rgba(255,255,255,0.86)"
  ha-color-on-neutral-quiet: "rgba(200,220,245,0.68)"
  ha-color-on-primary-loud: "#ffffff"
  ha-color-on-primary-normal: "#7db6ee"
  ha-color-on-primary-quiet: "#6cc6ff"
  ha-color-on-danger-normal: "#ff8f9a"
  ha-color-on-danger-quiet: "#ff9aa5"
  ha-color-on-success-normal: "#7fe0a0"
  ha-color-on-success-quiet: "#8fe8ad"
  ha-color-on-warning-normal: "#ffb36a"
  ha-color-on-warning-quiet: "#ffc080"
  ha-color-on-disabled-loud: "rgba(255,255,255,0.45)"
  ha-color-on-disabled-normal: "rgba(200,220,245,0.38)"
  ha-color-on-disabled-quiet: "rgba(200,220,245,0.32)"

  # Bordes
  ha-color-border-neutral-quiet: "rgba(120,170,230,0.18)"
  ha-color-border-neutral-normal: "rgba(150,190,235,0.38)"
  ha-color-border-neutral-loud: "#8fb4e3"
  ha-color-border-primary-quiet: "rgba(79,155,224,0.28)"
  ha-color-border-primary-normal: "#4f9be0"
  ha-color-border-primary-loud: "#7db6ee"
  ha-color-border-danger-quiet: "rgba(253,143,144,0.30)"
  ha-color-border-success-quiet: "rgba(93,195,111,0.30)"
  ha-color-border-warning-quiet: "rgba(255,147,66,0.30)"

  # Botones y etiquetas con relleno "normal" y "loud" (primario, peligro, éxito, aviso)
  ha-color-fill-primary-normal-resting: "rgba(79,155,224,0.30)"
  ha-color-fill-primary-normal-hover: "rgba(79,155,224,0.42)"
  ha-color-fill-primary-normal-active: "rgba(79,155,224,0.36)"
  ha-color-fill-primary-loud-resting: "#2c6fb3"
  ha-color-fill-primary-loud-hover: "#3a80c8"
  ha-color-fill-primary-loud-active: "#245c95"
  ha-color-fill-danger-normal-resting: "rgba(220,49,70,0.36)"
  ha-color-fill-danger-normal-hover: "rgba(220,49,70,0.48)"
  ha-color-fill-danger-normal-active: "rgba(220,49,70,0.42)"
  ha-color-fill-danger-loud-resting: "#c62a40"
  ha-color-fill-danger-loud-hover: "#d9344b"
  ha-color-fill-danger-loud-active: "#a82236"
  ha-color-fill-success-normal-resting: "rgba(0,160,70,0.36)"
  ha-color-fill-success-normal-hover: "rgba(0,160,70,0.48)"
  ha-color-fill-success-normal-active: "rgba(0,160,70,0.42)"
  ha-color-fill-success-loud-resting: "#0a7d3a"
  ha-color-fill-success-loud-hover: "#0e9448"
  ha-color-fill-success-loud-active: "#08662f"
  ha-color-fill-warning-normal-resting: "rgba(230,110,0,0.36)"
  ha-color-fill-warning-normal-hover: "rgba(230,110,0,0.48)"
  ha-color-fill-warning-normal-active: "rgba(230,110,0,0.42)"
  ha-color-fill-warning-loud-resting: "#c2570a"
  ha-color-fill-warning-loud-hover: "#d9660f"
  ha-color-fill-warning-loud-active: "#a24808"
